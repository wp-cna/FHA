name = "fha-forms"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
ALLOWED_ORIGIN = "https://wp-cna.github.io"
BOARD_EMAIL = "fha.wp.info@gmail.com"
# Until you verify a sending domain in Resend, you can use their test sender:
MAIL_FROM = "FHA Board <onboarding@resend.dev>"
GITHUB_REPO = "wp-cna/FHA"

# REQUIRED: pending board posts awaiting a human decision (the action links in
# the review email).
#
# NOTE: this Worker is live at fha-forms.fisher-hill.workers.dev, i.e. on the
# Cloudflare account whose workers.dev subdomain is "fisher-hill" — NOT on
# michael.kushman@gmail.com's personal account. KV namespace ids are per-account,
# so create this while logged into the fisher-hill account or the deploy fails
# with "KV namespace ... is not valid [code: 10042]":
#   wrangler login          # choose the account that owns fisher-hill.workers.dev
#   wrangler kv namespace create PENDING
[[kv_namespaces]]
binding = "PENDING"
id = "<paste-the-id-from-wrangler-kv-namespace-create-PENDING>"

# Optional: per-sender rate limiting. Create a KV namespace and uncomment:
#   wrangler kv namespace create RATE_LIMIT
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "<paste-the-id>"

# Secrets are NOT stored here. Set them with:
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put GITHUB_TOKEN
