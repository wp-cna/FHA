name = "fha-forms"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
ALLOWED_ORIGIN = "https://wp-cna.github.io"
BOARD_EMAIL = "fha.wp.info@gmail.com"
# Until you verify a sending domain in Resend, you can use their test sender:
MAIL_FROM = "FHA Board <onboarding@resend.dev>"
GITHUB_REPO = "wp-cna/FHA"

# REQUIRED: pending board posts awaiting a human decision (the action links in
# the review email).
#
# NOTE: KV namespace ids are per-account. This id belongs to
# michael.conor.kushman@gmail.com's account (6d17479a…), which is where this
# Worker now lives. Deploying from a different Cloudflare login fails with
# "KV namespace ... is not valid [code: 10042]" — create a new namespace there
# instead of reusing this id:
#   wrangler kv namespace create PENDING
[[kv_namespaces]]
binding = "PENDING"
id = "ed0dfb74d906428eaa6bbaa26c6d0e33"

# Optional: per-sender rate limiting. Create a KV namespace and uncomment:
#   wrangler kv namespace create RATE_LIMIT
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "<paste-the-id>"

# Secrets are NOT stored here. Set them with:
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put GITHUB_TOKEN
