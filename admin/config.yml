# FHA content admin (Sveltia CMS, Decap-compatible).
# Editors sign in with GitHub; saving commits to wp-cna/FHA on GitHub, and
# GitHub Pages republishes the live site automatically — allow about a minute.
#
# NOTE: Events are auto-imported nightly from the city calendar feed and are
# NOT edited here. data/events.json is regenerated by a GitHub Action, so any
# hand-edit would be overwritten. There is deliberately no Events collection.
backend:
  name: github
  repo: wp-cna/FHA
  branch: main
  # Sveltia auth Worker (shared with the WPCNA admin).
  base_url: https://wpcna-cms-auth.michael-kushman.workers.dev

site_url: https://wp-fha.org/
display_url: https://wp-fha.org/
# Sveltia always normalizes the GLOBAL public_folder to a root-absolute path
# ("/assets/uploads"), which would 404 on this /FHA/ subpath site — so any
# future image/file field must set its own field-level
# public_folder: "./assets/uploads" (the "./" form is kept verbatim).
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: posts
    label: "Neighborhood Posts"
    files:
      - name: posts
        label: "Posts list"
        file: "data/posts.json"
        fields:
          - { name: updated, label: "Last updated", widget: string, hint: "YYYY-MM-DD" }
          - { name: note, label: "Note (internal)", widget: string }
          - name: posts
            label: "Posts"
            label_singular: "Post"
            widget: list
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: category, label: "Category", widget: select, options: ["Business", "Lost & Found", "Tag Sale", "Neighbor", "Neighborhood Event", "Volunteer", "Neighborhood"] }
              - { name: fh, label: "Fisher Hill post?", widget: boolean, default: true }
              - { name: date, label: "Date this post is about", widget: string, hint: "YYYY-MM-DD, e.g. 2026-09-19. For an event, the day the event happens — not today's date. For anything else, today's date is fine." }
              - { name: dateLabel, label: "Date as shown on the site", widget: string, required: false, hint: 'e.g. "September 19, 2026". Leave blank and the site fills it in from the date above.' }
              - { name: time, label: "Time", widget: string, required: false, hint: 'e.g. "1:00 PM – 6:00 PM"' }
              - { name: location, label: "Location", widget: string, required: false }
              - { name: summary, label: "Summary", widget: text }
              - { name: source, label: "Posted by", widget: string }
              - { name: expires, label: "Expires", widget: string, required: false, hint: "YYYY-MM-DD — the site hides the post after this date. For an event, set this to the day AFTER it happens." }

  - name: agendas
    label: "Agendas & Minutes"
    files:
      - name: agendas
        label: "Agendas & minutes"
        file: "data/agendas.json"
        fields:
          # Internal how-to note stored in the JSON; hidden so it round-trips
          # unchanged instead of being stripped on save.
          - { name: _howto, widget: hidden }
          - name: annual
            label: "Annual Meetings — agendas & recaps"
            label_singular: "Annual meeting document"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: year, label: "Year", widget: number, value_type: int }
              - { name: title, label: "Title", widget: string }
              - { name: file, label: "Document (drag & drop to upload, or pick existing)", widget: file, required: false, media_folder: "/assets/agendas", public_folder: "./assets/agendas", hint: "Drag a PDF here or click to choose a file from your computer." }
          - name: board
            label: "Board Meetings — agendas & minutes"
            label_singular: "Board meeting document"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: year, label: "Year", widget: number, value_type: int }
              - { name: title, label: "Title", widget: string }
              - { name: file, label: "Document (drag & drop to upload, or pick existing)", widget: file, required: false, media_folder: "/assets/agendas", public_folder: "./assets/agendas", hint: "Drag a PDF here or click to choose a file from your computer." }
          - name: mayor
            label: "Mayor's Office Meetings — agendas & minutes"
            label_singular: "Mayor's Office meeting document"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: year, label: "Year", widget: number, value_type: int }
              - { name: title, label: "Title", widget: string }
              - { name: file, label: "Document (drag & drop to upload, or pick existing)", widget: file, required: false, media_folder: "/assets/agendas", public_folder: "./assets/agendas", hint: "Drag a PDF here or click to choose a file from your computer." }
